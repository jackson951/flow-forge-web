name: CI

on:
  push:
    branches: [main]
  pull_request:

# Part 14: least privilege, and a newer push cancels the older run of the same ref.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      # Part 13: coverage thresholds are part of the gate (FR-13.2).
      - run: npm run test:cov
      - run: npm run build
      # Part 12/13: initial JS ≤ 200 KB gzip, React Flow loaded on demand.
      - run: npm run check:bundle

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Part 14: no secret in the history (same pinned scanner as the backend).
      - name: gitleaks
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.21.2 git /repo --redact --verbose --exit-code 1

  image:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t flowforge-web:ci .
      # Part 14: fail on fixable HIGH/CRITICAL findings (scanner pinned by digest).
      - name: Scan image
        run: >-
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock
          aquasec/trivy@sha256:bcc376de8d77cfe086a917230e818dc9f8528e3c852f7b1aff648949b6258d1c
          image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 flowforge-web:ci
      # Part 14: the container serves the SPA with the security headers. nginx resolves the
      # "api" upstream at start, so it is pointed at localhost (the API itself is not needed).
      - name: Smoke test
        run: |
          docker run -d --name web --add-host api:127.0.0.1 -p 8080:8080 flowforge-web:ci
          for i in $(seq 1 30); do curl -fs http://localhost:8080/ >/dev/null && break; sleep 1; done
          docker exec web id -u | grep -qx 101
          curl -fsI http://localhost:8080/ > root.txt
          cat root.txt
          grep -qi "^content-security-policy: default-src 'self'" root.txt
          grep -qi "frame-ancestors 'none'" root.txt
          grep -qi '^x-content-type-options: nosniff' root.txt
          grep -qi '^referrer-policy: no-referrer' root.txt
          grep -qi '^x-frame-options: DENY' root.txt
          grep -qi '^cache-control: no-store' root.txt
          ! grep -qi '^strict-transport-security' root.txt
          curl -fsI -H 'X-Forwarded-Proto: https' http://localhost:8080/ | grep -qi '^strict-transport-security: max-age=31536000'
          ! grep -qi '^server: nginx/' root.txt
          curl -fs http://localhost:8080/w/abc/runs/xyz | grep -q '<div id="root">'
          asset=$(curl -fs http://localhost:8080/ | grep -o '/assets/[^"]*\.js' | head -1)
          curl -fsI "http://localhost:8080$asset" | grep -qi 'immutable'
      - name: Container logs
        if: failure()
        run: docker logs web || true
