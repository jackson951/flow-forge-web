name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      # Part 13: coverage thresholds are part of the gate (FR-13.2).
      - run: npm run test:cov
      - run: npm run build
      # Part 12/13: initial JS ≤ 200 KB gzip, React Flow loaded on demand.
      - run: npm run check:bundle
