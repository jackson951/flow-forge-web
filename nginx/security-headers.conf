# Security headers (Part 14, FR-14.3). Included in every location, because a location that
# sets its own add_header would otherwise drop the server-level ones.
#
# CSP: everything from this origin only — scripts, styles (Vite emits CSS files; React sets
# styles through the CSSOM, which CSP does not restrict), fonts (self-hosted), API calls (same
# origin through /api/). No inline scripts, no eval, no framing.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# HSTS only when the request arrived over TLS (directly or via a TLS-terminating proxy).
add_header Strict-Transport-Security $hsts always;
