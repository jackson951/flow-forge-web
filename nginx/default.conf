# FlowForge web (Part 14). Static SPA + same-origin proxy to the backend API.

# HSTS value: only over HTTPS (direct, or X-Forwarded-Proto from a TLS-terminating proxy).
map $http_x_forwarded_proto $forwarded_https {
  default "";
  https   "max-age=31536000; includeSubDomains";
}
map $https $hsts {
  default $forwarded_https;
  on      "max-age=31536000; includeSubDomains";
}

# Backend address: the Compose service "api" (override with an nginx template if needed).
upstream flowforge_api {
  server api:3000;
  keepalive 16;
}

server {
  listen 8080;
  listen [::]:8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  charset utf-8;

  gzip on;
  gzip_vary on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml font/woff2;

  # Content-hashed build assets: cache forever.
  location /assets/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # API on the same origin, so the SameSite=Strict refresh cookie is sent.
  location /api/ {
    include /etc/nginx/snippets/security-headers.conf;
    proxy_pass http://flowforge_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Request-Id $request_id;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    client_max_body_size 2m;
  }

  # The SPA shell: never cached, so a deploy is picked up on the next load.
  location = /index.html {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-store" always;
  }

  # Every app route (deep links like /w/:id/runs/:runId) falls back to the shell.
  location / {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-store" always;
    try_files $uri $uri/ /index.html;
  }
}
