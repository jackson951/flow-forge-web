# Part 13 E2E stack: the real backend (migrate → api → worker), Postgres and Redis in an isolated
# Compose project (own names, ports, network, volumes). Never reads a .env file: secrets are
# generated per run by e2e/global-setup.ts and passed in the environment.
#
# The backend image is built from the flowforge-api repository (FLOWFORGE_API_DIR, default: the
# sibling checkout). Started and stopped by Playwright's global setup/teardown.
name: flowforge-e2e

x-backend-env: &backend-env
  NODE_ENV: test
  LOG_LEVEL: warn
  DATABASE_URL: postgresql://flowforge:flowforge@postgres:5432/flowforge?schema=public
  REDIS_HOST: redis
  REDIS_PORT: '6379'
  QUEUE_PREFIX: e2e
  JWT_ACCESS_SECRET: ${E2E_JWT_ACCESS_SECRET:?generated by global setup}
  JWT_REFRESH_SECRET: ${E2E_JWT_REFRESH_SECRET:?generated by global setup}
  WEBHOOK_TEST_SECRET: ${E2E_WEBHOOK_TEST_SECRET:?generated by global setup}
  # Deterministic fake AI (allowed outside production) — no real provider calls.
  AI_PROVIDER: fake
  THROTTLE_ENABLED: 'false'
  RETENTION_ENABLED: 'false'
  CORS_ORIGINS: http://localhost:4173
  FRONTEND_URL: http://localhost:4173

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: flowforge
      POSTGRES_PASSWORD: flowforge
      POSTGRES_DB: flowforge
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U flowforge -d flowforge']
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    image: flowforge-migrate:e2e
    build:
      context: ${FLOWFORGE_API_DIR:-../../../flowforge-api/flowforge-api}
      target: migrate
    environment:
      DATABASE_URL: postgresql://flowforge:flowforge@postgres:5432/flowforge?schema=public
    depends_on:
      postgres:
        condition: service_healthy

  api:
    image: flowforge-api:e2e
    build:
      context: ${FLOWFORGE_API_DIR:-../../../flowforge-api/flowforge-api}
      target: runtime
    init: true
    command: ['node', 'dist/main.js']
    environment: *backend-env
    ports:
      - '127.0.0.1:${E2E_API_PORT:-3200}:3000'
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/api/v1/health/ready']
      interval: 3s
      timeout: 3s
      retries: 40

  worker:
    image: flowforge-api:e2e
    init: true
    command: ['node', 'dist/worker.js']
    environment:
      <<: *backend-env
      WORKER_HEARTBEAT_FILE: /tmp/flowforge-worker.heartbeat
    depends_on:
      api:
        condition: service_healthy
